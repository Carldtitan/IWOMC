[workspace]
members = ["crates/companion"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
