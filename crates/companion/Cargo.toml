[package]
name = "environment-REDACTED-companion"
description = "Trusted local observation companion for Environment Reconciler"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "environment_REDACTED_companion"
path = "src/lib.rs"

[[bin]]
name = "environment-REDACTED-companion"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
ctrlc = "3.5.1"
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hex = "0.4.3"
jsonschema = { version = "0.48.5", default-features = false }
keyring = "3.6.3"
regex = "1.12.2"
regress = "0.11.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.23.0"
