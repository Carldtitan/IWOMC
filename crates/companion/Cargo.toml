[package]
name = "environment-REDACTED-companion"
description = "Trusted local observation companion for Environment Reconciler"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "environment_REDACTED_companion"
path = "src/lib.rs"

[[bin]]
name = "environment-REDACTED-companion"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
hex = "0.4.3"
jsonschema = { version = "0.48.5", default-features = false }
regress = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"

[dev-dependencies]
proptest = "1.11.0"
